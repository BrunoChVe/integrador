    - path: reportes/raw_profile.json
      hash: md5
      md5: 1aacdba0f49f679249e0bf7f80ea6887
      size: 9152
    params:
      params.yaml:
        informe:
          bloques_muestra: 5
        ontology:
          version: 7
          ignore_id: 0
          classes:
          - id: 0
            name: unclassified
            name_es: ruido_sin_clasificar
            estado: activa
            color:
            - 128
            - 128
            - 128
            description: "Todo lo que no es un activo del alcance actual: suelo, fachadas,
              vegetacion, cables de baja y de telecomunicaciones, vehiculos, peatones,
              ruido, y cualquier cosa sobre la que el anotador no tenga confianza.
              Es un cajon de sastre a proposito: forzar una respuesta aqui contaminaria
              las otras clases. Con el alcance de 0017 esta clase pasa a ser la mayoria
              abrumadora de los puntos, y por eso queda EXCLUIDA de la perdida y de
              la mIoU (`ignore_id`): el modelo no se entrena para acertar \"no es
              nada\", se entrena para encontrar los postes. La ferreteria ACOPLADA
              al poste —mensula, cruceta— no cae aqui: es parte del poste desde 0015.\n"
          - id: 5
            name: pole_lv
            name_es: poste_bt
            estado: activa
            color:
            - 0
            - 150
            - 100
            description: "Poste de baja tension, CON o SIN luminaria instalada. Alcanza
              hasta unos 8 m, frente a los mas de 11 m del poste de media. Incluye
              el fuste MAS todo lo acoplado a el: mensulas, crucetas y herrajes (0015)
              y, desde 0023, tambien el conjunto de alumbrado —pastoral mas luminaria—.
              Un poste con luminaria es UN solo recorte, entero, con esta clase. NO
              incluye los conductores que cuelgan de la mensula. RETENIDA (0025):
              el brazo rigido del violin es poste; el cable que baja al piso, y su
              anclaje, son fondo. Lo que lo separa del poste de media es la altura
              y la ausencia de conductores de MT junto a su punta, no la luminaria.\n"
          - id: 12
            name: pole_mv
            name_es: poste_mt
            estado: activa
            color:
            - 255
            - 170
            - 0
            description: "Poste de media tension. Es el mas alto de la escena —supera
              los 11 m— y sostiene los conductores de MT. Se identifica por altura
              de columna y por tener conductores de media pasando junto a su punta.
              Incluye fuste, cruceta y herrajes (0015) y, si la lleva, la luminaria
              con su pastoral (0023): todo el poste es un solo recorte con esta clase.
              Retenida: el brazo rigido es poste, el cable al piso es fondo (0025).\n"
          - id: 13
            name: luminaire
            name_es: luminaria
            estado: obsoleta
            color:
            - 255
            - 240
            - 60
            description: "OBSOLETA desde 0023: la luminaria vuelve a ser parte del
              poste (5 o 12), que se recorta entero. El id se conserva, y no se reutiliza,
              para poder leer anotaciones hechas entre 0017 y 0023. Lo que sigue es
              la definicion que tuvo, por si se reactiva como clase propia. El conjunto
              de alumbrado publico completo: el PASTORAL —el brazo curvo que saca
              la carga fuera del eje del poste— mas el BLOQUE de la luminaria en su
              extremo. Clase propia desde 0017, y no un tipo de poste, porque la luminaria
              se instala indistintamente sobre un poste de baja (clase 5) y sobre
              uno de media (clase 12): hacerla atributo del poste obligaba a duplicar
              cada clase de poste, y asi el conteo de puntos de alumbrado —que es
              lo que mide el inventario— no se podia sacar de la prediccion. Se reconoce
              por tres cosas (0014, 0015): saca la carga a mas de 1 m del eje, acaba
              en un BLOQUE compacto, y de su punta NO cuelgan conductores. Una mensula
              tambien es un brazo lateral, pero es corta, de seccion constante, y
              de su extremo sale la baja tension: la mensula es poste, no luminaria.
              El limite con el poste se corta donde el pastoral se separa del fuste.
              Es un corte convencional y algo ambiguo en 2-3 cm de puntos; esa ambiguedad
              es conocida y se acepta.\n"
          - id: 9
            name: conductor_mv
            name_es: conductor_mt
            estado: en_espera
            color:
            - 255
            - 110
            - 0
            description: "Conductores de media tension: la red MT, el unico nivel
              de conductor dentro del alcance de 0017. Es el mas alto de la escena
              y el mas facil de anotar, que es justo por lo que entra: sus postes
              superan los 11 m frente a los 8 m de baja, y suele ir en TRES FASES
              sobre cruceta, con una separacion entre fases de 0.3 a 1.5 m que ninguna
              otra estructura de la calle reproduce. Cuando el armado es autoportante
              se ve como una sola linea, pero siempre por encima del nivel de BT.
              La baja tension antigua puede venir en 3 a 5 conductores paralelos y
              confundirse con un haz de MT: se separa por altura del haz (ver `weak_labels.wires.mv_bundle`).
              La separacion por altura sola es PROVISIONAL: ver 0013.\n"
          - id: 11
            name: pole_lv_light
            name_es: poste_bt_luminaria
            estado: obsoleta
            color:
            - 0
            - 200
            - 160
            description: "OBSOLETA desde 0017. Era \"poste de baja CON luminaria\"\
              , de cuando la luminaria era un tipo de poste en vez de una clase. Se
              descompone en poste_bt (5) para el fuste y luminaria (13) para el alumbrado.
              El id se conserva, y no se reutiliza, para poder seguir leyendo las
              anotaciones registradas antes de 0017; `tools/migrar_ontologia.py` las
              reparte entre 5 y 13.\n"
          - id: 1
            name: road
            name_es: pista
            estado: en_espera
            color:
            - 80
            - 80
            - 80
            description: Superficie de calzada vehicular, hasta el borde de la 
              vereda.
          - id: 2
            name: sidewalk
            name_es: vereda
            estado: en_espera
            color:
            - 200
            - 180
            - 140
            description: "Vereda peatonal, incluido su borde elevado. Ese borde no
              es una clase aparte: 12-20 cm de alto no sobreviven a voxeles de 5 cm,
              y separarlo daria una clase casi sin puntos (ver 0013).\n"
          - id: 3
            name: building
            name_es: limite_construccion
            estado: en_espera
            color:
            - 180
            - 70
            - 60
            description: "Fachadas y muros de limite de propiedad. Objetivo del paso
              de vectorizacion de poligonos para exportacion a CAD.\n"
          - id: 4
            name: manhole
            name_es: buzon
            estado: en_espera
            color:
            - 255
            - 200
            - 0
            description: "Tapas de acceso a servicios, enrasadas con la pista o la
              vereda. La clase mas dificil: un disco de 0.6 a 1.0 m geometricamente
              coplanar con su entorno, separable sobre todo por intensidad y color.\n"
          - id: 6
            name: conductor_lv
            name_es: conductor_bt
            estado: en_espera
            color:
            - 230
            - 30
            - 30
            description: "Conductores de baja tension. Cuelgan de postes que llegan
              hasta unos 8 m, por encima del nivel de telecomunicaciones y por debajo
              de la media tension. Antes esta clase agrupaba BT y MT (ver 0013). Aunque
              esta en espera, el borrador sigue calculando su mascara EN MEMORIA sin
              etiquetarla: es la senal negativa que distingue una mensula de un pastoral
              —si del extremo del brazo cuelga baja tension, es mensula— y sin ella
              la clase 13 pierde su mejor discriminante.\n"
          - id: 7
            name: telecom_line
            name_es: cable_telecom
            estado: en_espera
            color:
            - 30
            - 90
            - 230
            description: "Haces de telefonia, television por cable y fibra. Cuelgan
              por debajo del nivel electrico y son mucho mas densos y desordenados
              (las \"telaranas\"). Separar la clase 6 de la 7 es sobre todo un problema
              de nivel de altura y grosor de haz, no de apariencia punto a punto.\n"
          - id: 8
            name: green_area
            name_es: area_verde
            estado: en_espera
            color:
            - 110
            - 180
            - 60
            description: "Areas verdes a nivel de suelo junto a la calzada: bermas
